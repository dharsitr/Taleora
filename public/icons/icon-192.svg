<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#2a201b" />
      <stop offset="45%" stop-color="#181310" />
      <stop offset="85%" stop-color="#0e0b0a" />
      <stop offset="100%" stop-color="#070605" />
    </radialGradient>

    <!-- Bevel / Edge Highlights -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#d97706" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.4" />
    </linearGradient>

    <!-- Gold Foil Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="90%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="goldLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fde68a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Parchment Page Gradients -->
    <linearGradient id="pageLeftTop" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#e8ded1" />
      <stop offset="20%" stop-color="#f7f3eb" />
      <stop offset="70%" stop-color="#fffefb" />
      <stop offset="100%" stop-color="#f3ebe0" />
    </linearGradient>

    <linearGradient id="pageRightTop" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e3d8ca" />
      <stop offset="20%" stop-color="#f7f3eb" />
      <stop offset="70%" stop-color="#fffefb" />
      <stop offset="100%" stop-color="#f3ebe0" />
    </linearGradient>

    <linearGradient id="pageUnder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8bcaa" />
      <stop offset="50%" stop-color="#ded4c5" />
      <stop offset="100%" stop-color="#b8ab96" />
    </linearGradient>

    <!-- Warm Ambient Light Core -->
    <radialGradient id="storyLight" cx="50%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#b45309" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- iOS Squircle App Icon Base -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bgGlow)" />

  <!-- Ambient Golden Center Bloom behind the book -->
  <circle cx="512" cy="530" r="380" fill="url(#storyLight)" />

  <!-- Outer Bevel Edge / Border -->
  <rect x="8" y="8" width="1008" height="1008" rx="222" fill="none" stroke="url(#rimStroke)" stroke-width="4" stroke-opacity="0.6" />

  <!-- The Open Book Structure -->
  <g filter="url(#bookShadow)">
    <!-- Under-stack pages / Book Edge Layer 3 -->
    <path d="M 512 730
             C 410 706, 275 722, 192 762
             L 192 485
             C 275 442, 410 430, 512 452
             C 614 430, 749 442, 832 485
             L 832 762
             C 749 722, 614 706, 512 730 Z"
          fill="#45382b" opacity="0.6" />

    <!-- Under-stack pages / Book Edge Layer 2 -->
    <path d="M 512 718
             C 412 696, 280 710, 202 748
             L 202 476
             C 280 436, 412 424, 512 444
             C 612 424, 744 436, 822 476
             L 822 748
             C 744 710, 612 696, 512 718 Z"
          fill="url(#pageUnder)" />

    <!-- Left Page Main Top Surface -->
    <path d="M 512 702
             C 415 674, 290 686, 214 728
             C 210 710, 208 510, 214 466
             C 290 422, 415 410, 512 432
             Z"
          fill="url(#pageLeftTop)" />

    <!-- Right Page Main Top Surface -->
    <path d="M 512 702
             C 609 674, 734 686, 810 728
             C 814 710, 816 510, 810 466
             C 734 422, 609 410, 512 432
             Z"
          fill="url(#pageRightTop)" />

    <!-- Left Page Subtle Gilded Accent Lines -->
    <g opacity="0.28" stroke="#8b7355" stroke-width="5" stroke-linecap="round">
      <line x1="285" y1="504" x2="455" y2="486" />
      <line x1="285" y1="544" x2="455" y2="526" />
      <line x1="285" y1="584" x2="435" y2="566" />
      <line x1="285" y1="624" x2="415" y2="606" />
    </g>

    <!-- Right Page Subtle Gilded Accent Lines -->
    <g opacity="0.28" stroke="#8b7355" stroke-width="5" stroke-linecap="round">
      <line x1="569" y1="486" x2="739" y2="504" />
      <line x1="569" y1="526" x2="739" y2="544" />
      <line x1="589" y1="566" x2="739" y2="584" />
      <line x1="609" y1="606" x2="739" y2="624" />
    </g>

    <!-- Page Curvature Gutter Shadow -->
    <path d="M 512 432 C 496 520, 496 615, 512 702 C 528 615, 528 520, 512 432 Z"
          fill="#1c1612" opacity="0.45" />

    <!-- Spine Gold Accent Binding Pin -->
    <line x1="512" y1="428" x2="512" y2="705"
          stroke="url(#goldSheen)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Flowing Satin Silk Bookmark Ribbon -->
    <path d="M 512 410 Q 528 540, 560 660 L 588 775 L 560 755 L 532 775 L 522 650 Q 508 535, 512 410 Z"
          fill="#000000" opacity="0.35" transform="translate(6, 12)" />

    <!-- Ribbon Body -->
    <path d="M 508 405
             C 514 490, 532 580, 558 668
             L 582 768
             L 556 746
             L 530 766
             C 520 670, 508 580, 504 405 Z"
          fill="url(#ribbonGrad)" />

    <!-- Golden Highlight on ribbon curve -->
    <path d="M 512 405 C 516 490, 533 580, 556 665 L 560 665 C 536 580, 520 490, 516 405 Z"
          fill="#fef08a" opacity="0.75" />
  </g>

  <!-- Glowing Taleora Star Rising from Center -->
  <g filter="url(#glowFilter)">
    <path d="M 512 260
             Q 512 320, 538 335
             Q 512 350, 512 410
             Q 512 350, 486 335
             Q 512 320, 512 260 Z"
          fill="url(#starGlow)" />

    <path d="M 437 335
             Q 490 335, 512 318
             Q 534 335, 587 335
             Q 534 335, 512 352
             Q 490 335, 437 335 Z"
          fill="url(#starGlow)" />

    <path d="M 466 289
             Q 505 328, 512 335
             Q 519 342, 558 381
             Q 519 342, 512 335
             Q 505 328, 466 289 Z"
          stroke="url(#goldLight)" stroke-width="3" stroke-linecap="round" opacity="0.85" />

    <path d="M 558 289
             Q 519 328, 512 335
             Q 505 342, 466 381
             Q 505 342, 512 335
             Q 519 328, 558 289 Z"
          stroke="url(#goldLight)" stroke-width="3" stroke-linecap="round" opacity="0.85" />

    <circle cx="512" cy="335" r="9" fill="#ffffff" />
    <circle cx="512" cy="335" r="22" fill="#fde68a" opacity="0.6" />
    <circle cx="512" cy="335" r="45" fill="#f59e0b" opacity="0.25" />

    <path d="M 388 385 Q 388 397, 396 401 Q 388 405, 388 417 Q 388 405, 380 401 Q 388 397, 388 385 Z"
          fill="#fde68a" opacity="0.85" />

    <path d="M 648 375 Q 648 390, 658 395 Q 648 400, 648 415 Q 648 400, 638 395 Q 648 390, 648 375 Z"
          fill="#fef08a" opacity="0.9" />

    <circle cx="440" cy="425" r="3.5" fill="#fde68a" opacity="0.7" />
    <circle cx="584" cy="420" r="4" fill="#fde68a" opacity="0.75" />
    <circle cx="512" cy="225" r="2.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Specular Top Gloss Curve -->
  <path d="M 0 228
           C 0 102, 102 0, 228 0
           L 796 0
           C 922 0, 1024 102, 1024 228
           C 1024 260, 980 290, 890 320
           C 680 390, 344 390, 134 320
           C 44 290, 0 260, 0 228 Z"
        fill="#ffffff" opacity="0.04" />
</svg>

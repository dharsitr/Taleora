<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f3ede2" />
    </linearGradient>
  </defs>
  <!-- Full bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bg)" />
  
  <!-- Safe zone inner content (centered) -->
  <g transform="translate(106, 140) scale(0.92)">
    <!-- Book Shadow -->
    <path d="M 160 234 C 112 224, 48 230, 10 252 L 10 74 C 48 52, 112 48, 160 70 C 208 48, 272 52, 310 74 L 310 252 C 272 230, 208 224, 160 234 Z" fill="#000000" opacity="0.45" transform="translate(0, 10)" />
    
    <!-- Left Leaf / Page -->
    <path d="M 160 224 C 112 214, 48 220, 10 242 L 10 64 C 48 42, 112 38, 160 60 Z" fill="url(#pages)" />
    <path d="M 160 224 C 112 214, 48 220, 10 242 L 10 64 C 48 42, 112 38, 160 60 Z" fill="url(#gold)" opacity="0.08" />
    <line x1="42" y1="96" x2="128" y2="88" stroke="#78716c" stroke-width="6.5" stroke-linecap="round" opacity="0.4" />
    <line x1="42" y1="122" x2="128" y2="114" stroke="#78716c" stroke-width="6.5" stroke-linecap="round" opacity="0.4" />
    <line x1="42" y1="148" x2="118" y2="140" stroke="#78716c" stroke-width="6.5" stroke-linecap="round" opacity="0.4" />
    <line x1="42" y1="174" x2="108" y2="166" stroke="#78716c" stroke-width="6.5" stroke-linecap="round" opacity="0.4" />
    
    <!-- Right Leaf / Page -->
    <path d="M 160 224 C 208 214, 272 220, 310 242 L 310 64 C 272 42, 208 38, 160 60 Z" fill="url(#pages)" />
    <path d="M 160 224 C 208 214, 272 220, 310 242 L 310 64 C 272 42, 208 38, 160 60 Z" fill="url(#gold)" opacity="0.12" />
    <line x1="192" y1="88" x2="278" y2="96" stroke="#78716c" stroke-width="6.5" stroke-linecap="round" opacity="0.4" />
    <line x1="192" y1="114" x2="278" y2="122" stroke="#78716c" stroke-width="6.5" stroke-linecap="round" opacity="0.4" />
    <line x1="192" y1="140" x2="268" y2="148" stroke="#78716c" stroke-width="6.5" stroke-linecap="round" opacity="0.4" />
    <line x1="192" y1="166" x2="258" y2="174" stroke="#78716c" stroke-width="6.5" stroke-linecap="round" opacity="0.4" />

    <!-- Center Spine Crease -->
    <path d="M 160 60 L 160 224" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" />

    <!-- Golden Silk Ribbon Bookmark -->
    <path d="M 160 44 L 160 140 L 173 126 L 186 140 L 186 46 Z" fill="url(#gold)" />
  </g>
</svg>
